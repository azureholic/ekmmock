# Keeps the pinned dependencies current: NuGet packages, the SHA-pinned GitHub Actions and the digest-pinned base images of the Dockerfile.
# Updates arrive as grouped weekly pull requests; CI (build, tests, vulnerability scan, image conformance) judges them.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Fluent UI Blazor v4 is a deliberate choice (docs/DECISIONS.md "M5: Packages", open question 37): v5 is a different component model and needs its own migration.
      - dependency-name: "Microsoft.FluentUI.AspNetCore.Components*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns: ["*"]
